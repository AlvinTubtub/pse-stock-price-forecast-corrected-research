name: Manual approved operational refresh (disabled)

# Run 02 review: no cron, external dispatch, commit, push, or deployment.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pse-pipeline
  cancel-in-progress: false

jobs:
  train:
    # Remote execution requires a separate reviewed change after local acceptance.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-pipeline.txt
      - name: Refresh approved deployment models strictly
        working-directory: backend
        run: python -m services.model_selector --mode deployment-refresh --strict
      - name: Export frontend JSON artifacts
        working-directory: backend
        run: python scripts/export_forecast_artifacts.py
      - name: Validate exported artifacts
        working-directory: backend
        run: python scripts/validate_exports.py
