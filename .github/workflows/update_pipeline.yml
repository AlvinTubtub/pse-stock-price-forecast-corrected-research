name: Daily official-data and approved forecast refresh

# Triggered by Cron-job.org in Asia/Manila:
# - Monday at 17:30
# - Tuesday-Friday at 16:00
on:
  repository_dispatch:
    types: [update-pse-data]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pse-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements-fast.txt
            backend/requirements-inference.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-fast.txt
          pip install -r requirements-inference.txt
      - name: Check PSE trading calendar
        id: check_calendar
        working-directory: backend
        run: python scripts/check_pse_trading_day.py
      - name: Ingest official data and generate approved forecasts
        if: steps.check_calendar.outputs.is_trading_day == 'true'
        working-directory: backend
        run: python run_pipeline.py --no-train
      - name: Export frontend artifacts
        if: steps.check_calendar.outputs.is_trading_day == 'true'
        working-directory: backend
        run: python scripts/export_forecast_artifacts.py
      - name: Validate exported artifacts
        if: steps.check_calendar.outputs.is_trading_day == 'true'
        working-directory: backend
        run: python scripts/validate_exports.py
      - name: Commit and push validated artifacts
        if: steps.check_calendar.outputs.is_trading_day == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/raw backend/latest_processed.json backend/operational/current.json frontend/public/forecasts
          if git diff --cached --quiet; then
            echo "[daily-workflow] No validated artifact changes to commit."
          else
            git commit -m "Automated data and forecast update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
